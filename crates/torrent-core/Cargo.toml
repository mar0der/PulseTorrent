[package]
name = "torrent-core"
version = "0.14.0"
edition = "2021"
description = "BitTorrent protocol implementation in Rust"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sha1 = "0.10"
rand = "0.8"
url = "2"
urlencoding = "2"
thiserror = "2"
log = "0.4"
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
