name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x86_64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: '${{ github.ref_name }}'
          releaseBody: |
            See the assets below to download PulseTorrent for your platform.

            ## Installation

            **macOS**: Download the `.dmg` for your architecture (arm64 = Apple Silicon, x64 = Intel). Open the `.dmg` and drag PulseTorrent to Applications.

            > **Important — macOS "damaged" warning:** Since the app is not code-signed, macOS may block it. Open Terminal and run:
            > ```
            > xattr -cr /Applications/PulseTorrent.app
            > ```
            > Then open the app normally. You only need to do this once.

            **Windows**: Download and run the `.msi` installer.

            **Linux**: Download the `.deb` package or `.AppImage`.
          releaseDraft: false
          prerelease: false
